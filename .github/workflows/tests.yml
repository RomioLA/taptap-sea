name: lua-tests

on: [push, pull_request]

jobs:
  circle1-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - name: Run Circle1B offline regression suites
        run: python tests/run_circle1_b.py
